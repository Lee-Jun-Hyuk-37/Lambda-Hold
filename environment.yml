# Conda environment for Lambda-Hold.
#
# Prerequisite (not installable here): SCONE with the Hyfydy engine must be
# installed separately so that `sconepy` is available. The musculoskeletal
# model and simulator are provided through the `external/sconegym` submodule,
# which uses `sconepy` from the SCONE installation. See the README.
#
# PyTorch is pinned to the tested version, but the correct CPU/CUDA build is
# machine-specific: if the pinned build does not match your system, install the
# matching wheel from https://pytorch.org and keep the other versions below.
name: lambda-hold
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - torch==2.8.0
      - stable-baselines3==2.7.0
      - gymnasium==1.1.1
      - gym==0.26.2
      - numpy==1.26.0
      - scipy==1.13.1
      - matplotlib==3.9.4
      - pandas==2.3.2
      - cloudpickle==3.1.1
